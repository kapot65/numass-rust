rust-version.workspace = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
name = "py_numass"
crate-type = ["cdylib"]

[dependencies]
numass_processing = { workspace = true }

protobuf = "3.2.0"

pyo3 = { version = "0.18.0", features = ["extension-module"] }
numpy = "0.18.0"
