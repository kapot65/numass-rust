[package]
name = "numass-processing"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
name = "numass_processing"
crate-type = ["rlib", "cdylib"]

[dependencies]
natord = "1.0.9"
chrono = { version = "0.4.22", features = ["serde"] }

serde = { version = "1.0.163", features = ["derive"] }
serde_json = "1.0.91"
serde_qs = "0.13.0"
numass = { workspace = true }

egui = { version = "0.36", optional = true }
egui_plot = { version = "0.37", optional = true }
egui_extras = { version = "0.36", features = ["image", "svg"], optional = true }
egui_code_editor = { version = "0.4.2", optional = true }
plotly = { version = "0.8.3", optional = true }
rgb_hsv = { version = "1.0.1", optional = true }
clap = { version = "4", features = ["derive"], optional = true }
polars = { version = "0.55.2", optional = true }
pyo3 = { version = "0.29.3", optional = true }
pyo3-polars = { version = "0.28.0", optional = true, default-features = false }
pyo3-stub-gen = { version = "0.23.1", optional = true, default-features = false, features = [
    "infer_signature",
] }
pyo3-stub-gen-derive = { version = "0.23.1", optional = true }

protobuf = "3.2.0"
uom = { version = "0.38.0", default-features = false, features = ["autoconvert", "f64", "si", "std", "serde"] }
ulua = { version = "0.1.7", default-features = false, features = ["typecheck", "serde"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { version = "1.21.2", features = ["full"] }
dataforge = { workspace = true, features = ["tokio"] }
# JIT — только native (A64/x64). На wasm32 фича не собирается, шаг идёт на интерпретаторе.
ulua = { version = "0.1.7", default-features = false, features = ["typecheck", "serde", "jit"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3.52"
gloo = { version = "0.11.0", features = ["net", "console", "utils", "worker", "futures"] }
dataforge = { workspace = true }
rmp-serde = "1.1.1"
urlencoding = "2.1.3"
# PROPFIND multistatus. UTF-8 only: WebDAV XML from dav-server is UTF-8.
xmltree = { version = "0.12", default-features = false }

[features]
default = []
clap = ["dep:clap"]
egui = ["dep:egui", "dep:egui_plot", "dep:egui_extras", "dep:egui_code_editor"]
plotly = ["dep:plotly", "dep:rgb_hsv"]
polars = ["dep:polars"]
# Весь Python-binding код, включая to_polars. Maturin включает только эту фичу.
python = ["dep:pyo3", "polars", "dep:pyo3-polars", "dep:pyo3-stub-gen-derive"]
# Ручная сборка cdylib без libpython. Maturin 1.9+ ставит PYO3_BUILD_EXTENSION_MODULE сам.
extension-module = ["python", "pyo3/extension-module"]
stubgen = ["python", "dep:pyo3-stub-gen"]

[[bin]]
name = "stub_gen"
path = "src/bin/stub_gen.rs"
required-features = ["stubgen"]

