[project]
name = "numass-processing"
version = "2.0.0" # version.nu обновляет только Cargo.toml
description = "Configuration objects for numass-processing"
readme = "README.md"
authors = [
    { name = "chernov", email = "kapot65@gmail.com" }
]
requires-python = ">=3.14.8"
dependencies = []

[build-system]
requires = ["maturin>=1.15.0,<2.0"]
build-backend = "maturin"

[tool.maturin]
module-name = "numass_processing"
# Только python: clap, egui, plotly и polars в модуль не входят.
features = ["python"]

[dependency-groups]
dev = [
    "maturin>=1.15.0",
]
