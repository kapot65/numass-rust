[package]
name = "frontend"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0.66"
console_error_panic_hook = "0.1.7"
gloo-net = "0.2.4"
gloo-timers = "0.2.4"
gloo-utils = "0.1.5"
gloo-console = "0.2.3"
serde = { version = "1.0.147", features = ["derive"] }
serde_json = "1.0.87"
bendy = { version = "0.4.0-beta.2", features = ["std", "serde"] }
tracing = "0.1.37"
tracing-wasm = "0.2.1"

wasm-bindgen = "0.2.83"
wasm-bindgen-futures = "0.4.33"

futures = "0.3.25"
reqwasm = "0.5.0"


yew = "0.19.3"
yew-router = "0.16.0"
yew-agent = "0.1.0"

tokio = "1.21.2"

wasm-sockets = "0.2.2"
protobuf = "3.2.0"

plotters = "0.3.4"
plotters-canvas = "0.3.0"

common = {path = "../common"}

# playground = {path = "../playground"}

[build-dependencies]
protobuf-codegen = "3.2.0"

