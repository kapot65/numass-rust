[package]
name = "data-viewer-web"
version = "0.1.0"
authors = ["Vasily Chernov <kapot65@gmail.com>"]
edition = "2021"
rust-version = "1.65"

[dependencies]
egui = "0.21.0"
egui_extras = { version =  "0.21.0", features = ["image"]}
eframe = { version = "0.21.0", default-features = false, features = [
    "accesskit",     # Make egui comptaible with screen readers. NOTE: adds a lot of dependencies.
    "default_fonts", # Embed the default egui fonts.
    "glow",          # Use the glow rendering backend. Alternative: "wgpu".
    "persistence",   # Enable restoring app state when restarting the app.
] }

# You only need serde if you want app persistence:
serde = { version = "1", features = ["derive"] }
tracing = "0.1.37"
serde_json = "1.0.91"
clap = "4.1.4"

# native:
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tracing-subscriber = "0.3"

numass = { git = "ssh://git@bitbucket.org/Kapot/dataforge-parser-numass.git", tag = "0.1.0" }
dataforge = { git = "ssh://git@bitbucket.org/Kapot/dataforge-parser-rust.git", tag = "0.1.0" }
processing = {path = "../processing", features = ["desktop"]}

tokio = { version = "1.21.2", features = ["full"] }
natord = "1.0.9"
protobuf = "3.2.0"
rfd = "0.11.1"

home = "0.5.4"
which = "4.4.0"

actix-web = "4.3.0"
actix-files = "0.6.2"

# web:
[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook = "0.1.6"
tracing-wasm = "0.2"
wasm-bindgen-futures = "0.4"
gloo-timers = "0.2.6"
gloo-net = "0.2.6"
processing = {path = "../processing", features = []}
