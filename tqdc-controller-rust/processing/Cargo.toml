[package]
name = "processing"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
dataforge = { git = "ssh://git@bitbucket.org/Kapot/dataforge-parser-rust.git", tag = "0.1.0", optional = true }
numass = { git = "ssh://git@bitbucket.org/Kapot/dataforge-parser-numass.git", tag = "0.1.0", optional = true }

serde = "1.0.152"
serde_json = "1.0.91"

tokio = { version = "1.21.2", features = ["full"], optional = true }
protobuf = "3.2.0"

linreg = "0.2.0"

plotters = "0.3.1"
plotly = "0.8.3"

eframe = "0.19.0"

clap = { version = "4.0.26", features = ["derive"] }

[features]
# Defines a feature named `webp` that does not enable any other features.
desktop = ["dep:dataforge", "dep:numass", "dep:tokio"]
