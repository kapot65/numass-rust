[package]
name = "dataforge"
version = "0.1.0"
edition = "2021"

[dependencies]
protobuf = "3.2.0"
tokio = { version = "1.21.2", features = ["full"] }
serde = { version = "1.0.147", features = ["derive"] }
chrono = { version = "0.4.22", features = ["serde"] }
serde_json = "1.0.87"
serde_with = "2.0.1"

[build-dependencies]
protobuf-codegen = "3.2.0"


