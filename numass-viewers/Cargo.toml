[package]
name = "numass-viewers"
authors = ["Vasily Chernov <kapot65@gmail.com>"]
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
egui = "0.36"
egui_plot = "0.37"
egui_extras = { version = "0.36", features = ["image", "svg"] }
eframe = { version = "0.36" }

serde = { version = "1.0.163", features = ["derive"] }
serde_json = "1.0.91"
rmp-serde = "1.1.1"

tracing = "0.1.37"

numass_processing = { workspace = true, features = ["egui"] }

protobuf = "3.7.1"

chrono = "0.4.23"
natord = "1.0.9"
globset = "0.4.11"


# native:
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tracing-subscriber = "0.3"

tokio = { version = "1.21.2", features = ["full"] }
dataforge = { workspace = true, features = ["tokio"] }

rfd = "0.14.1"
home = "0.5.4"
which = "6.0.1"

clap = { version = "4.5.26", features = ["derive"] }

[target.'cfg(target_family = "unix")'.dependencies]
tikv-jemallocator = { workspace = true }

# web:
[target.'cfg(target_arch = "wasm32")'.dependencies]
tracing-wasm = "0.2"
console_error_panic_hook = "0.1.6"

dataforge = { workspace = true }

wasm-bindgen = "0.2.86"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["DedicatedWorkerGlobalScope", "MessageEvent", "Worker"] }

js-sys = "0.3.52"
gloo = { version = "0.11.0", features = [
    "net",
    "console",
    "utils",
    "worker",
    "futures",
] }
