[package]
name = "numass-root"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
cxx = { version = "1.0.138", features = ["c++17"] }
# uniffi = { version = "0.25.0" }

dataforge = { workspace = true }
numass = { workspace = true }
numass_processing = { workspace = true, features = ["egui", "plotly"] }
# processing = { git = "https://github.com/kapot65/numass-processing.git", features = ["egui", "plotly"] }
protobuf = "3.3.0"
serde_json = "1.0.138"

[build-dependencies]
cbindgen = "0.28.0"
cmake = "0.1.58"
# uniffi = { version = "0.25.0", features = [ "build" ] }

# [patch."https://github.com/kapot65/numass-processing.git"]
# processing = { path = "../numass-processing" }

[lib]
crate-type = ["cdylib", "staticlib"]
